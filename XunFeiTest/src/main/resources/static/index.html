<script>
    //api
    const ws = new WebSocket('ws://localhost:8089/websocket/123');  //接口

    const  message={
        "content":"你好",
        "userId":"123",
        "type":"spark",
        "historyId":null,
        "chatType":"spaark",
    }
    ws.onopen = () => {
        console.log('Connected');
        ws.send(JSON.stringify(message))
    };


    ws.onmessage = (event) => {
        console.log('Message from server ', event);
    };

    ws.onclose = () => {
        console.log('Disconnected');
    };

    ws.onerror = (error) => {
        console.log('WebSocket error: ' + error);
    };

</script>
