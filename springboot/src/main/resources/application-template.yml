spring:
  application:
    name: springboot
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/heritage_db?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_MYSQL_PASSWORD
  
  # 安全配置
  security:
    user:
      name: admin
      password: admin
  main:
    allow-bean-definition-overriding: true
  # 邮件配置
  mail:
    host: smtp.qq.com
    username: 32596652@qq.com
    password: YOUR_EMAIL_PASSWORD
    default-encoding: utf-8
    port: 587
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          ssl:
            enable: true
            protocols: TLSv1.2
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
  
  # Web配置
  mvc:
    static-path-pattern: /**  # 允许根路径访问静态资源
  web:
    resources:
      static-locations: classpath:/static/, file:./files/  # 添加files目录
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  
  # JSON配置
  jackson:
    default-property-inclusion: non_empty
  #注意事项这里需要配置自己的apikey，访问硅基流动官网注册：https://siliconflow.cn/
  # Spring AI配置
  ai:
    openai:
      api-key: YOUR_SILICONFLOW_API_KEY
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
          temperature: 0.7
        completions-path: /v1/chat/completions

# ========== 小米 MiMo 模型配置 ==========
# 兼容 OpenAI 接口协议，填入 key 后即可使用
# AI 对话模型：MiMo-v2.5-pro / MiMo-v2.5 / MiMo-v2-pro / MiMo-v2-Omni
# TTS 模型：MiMo-v2.5-TTS / MiMo-v2.5-TTS-VoiceClone / MiMo-v2.5-TTS-VoiceDesign
mimo:
  api-key: YOUR_MIMO_API_KEY
  base-url: https://token-plan-cn.xiaomimimo.com/v1
  chat:
    model: mimo-v2.5-pro
  tts:
    model: mimo-v2.5-tts

# ========== TTS Provider 切换 ==========
# siliconflow: CosyVoice2 云端TTS（当前默认）
# mimo:        小米 MiMo TTS
tts:
  provider: mimo

# 服务器配置
server:
  port: 8889
  servlet:
    context-path: /

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# SpringDoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  enable-spring-security: false
  paths-to-match: /**
  packages-to-scan: org.example.springboot

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  basic:
    enable: true
    username: admin
    password: admin

# JWT配置
jwt:
  secret: YOUR_JWT_SECRET
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀


# 文件管理配置
file:
  upload:
    path: ./files
    maxSize: 524288000  # 500MB (500 * 1024 * 1024)
