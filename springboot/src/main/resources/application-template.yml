spring:
  application:
    name: springboot
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sanxingdui_repro?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: YOUR_MYSQL_USERNAME
    password: YOUR_MYSQL_PASSWORD
  
  # 安全配置
  security:
    user:
      name: YOUR_ADMIN_USERNAME
      password: YOUR_ADMIN_PASSWORD
  main:
    allow-bean-definition-overriding: true
  # 邮件配置
  mail:
    host: smtp.qq.com
    username: YOUR_EMAIL_USERNAME
    password: YOUR_EMAIL_PASSWORD
    default-encoding: utf-8
    port: 587
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          ssl:
            enable: true
            protocols: TLSv1.2
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
  
  # Web配置
  mvc:
    static-path-pattern: /**  # 允许根路径访问静态资源
  web:
    resources:
      static-locations: classpath:/static/, file:./files/  # 添加files目录
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  
  # JSON配置
  jackson:
    default-property-inclusion: non_empty
  #注意事项这里需要配置自己的apikey，访问硅基流动官网注册：https://siliconflow.cn/
  # Spring AI配置
  ai:
    openai:
      api-key: YOUR_SILICONFLOW_API_KEY
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: Qwen/Qwen3-VL-30B-A3B-Instruct
          temperature: 0.7
        completions-path: /v1/chat/completions

# ========== 小米 MiMo 模型配置 ==========
mimo:
  api-key: YOUR_MIMO_API_KEY
  base-url: https://token-plan-sgp.xiaomimimo.com/v1
  chat:
    model: mimo-v2.5-pro
  tts:
    model: mimo-v2.5-tts

# ========== Zhipu GLM-TTS configuration ==========
zhipu:
  api-key: ${ZHIPU_API_KEY:}
  base-url: https://open.bigmodel.cn/api/paas/v4
  tts:
    model: glm-tts

# ========== DeepSeek 模型配置（备选 AI Provider） ==========
# OpenAI 兼容协议，base-url: https://api.deepseek.com
# 模型：deepseek-v4-flash / deepseek-v4-pro
deepseek:
  api-key: YOUR_DEEPSEEK_API_KEY
  base-url: https://api.deepseek.com
  chat:
    model: deepseek-v4-flash

# ========== TTS Provider 切换 ==========
tts:
  provider: zhipu

# ========== ASR Provider 配置 ==========
asr:
  openai:
    transcriptions-path: /v1/audio/transcriptions
    model: FunAudioLLM/SenseVoiceSmall
    language: zh

# ========== Video analysis 配置 ==========
image:
  analysis:
    timeout-seconds: 25

video:
  ffmpeg:
    path: ffmpeg
    ffprobe-path: ffprobe
    frame-count: 3
    max-duration-seconds: 120
    work-dir: ai-chat-video
  analysis:
    frame-timeout-seconds: 60
    audio-timeout-seconds: 90

# ========== Document extraction 配置 ==========
document:
  extract:
    max-chars: 12000

# 服务器配置
server:
  port: 8889
  servlet:
    context-path: /

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# SpringDoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  enable-spring-security: false
  paths-to-match: /**
  packages-to-scan: org.example.springboot

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  basic:
    enable: true
    username: YOUR_KNIFE4J_USERNAME
    password: YOUR_KNIFE4J_PASSWORD

# JWT配置
jwt:
  secret: YOUR_JWT_SECRET
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀


# 文件管理配置
file:
  upload:
    path: ./files
    maxSize: 524288000  # 500MB (500 * 1024 * 1024)

# ========== Neo4j 图谱读模型（默认关闭） ==========
graph:
  neo4j:
    enabled: false
    uri: bolt://localhost:7687
    username: neo4j
    password: YOUR_NEO4J_PASSWORD
    database:
